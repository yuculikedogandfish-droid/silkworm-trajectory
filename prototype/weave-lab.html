<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>织网实验台 · Weave Lab</title>
<style>
  :root{
    --bg:#070A0C; --panel:#0E1315; --line:rgba(230,236,233,.12);
    --fg:#E6ECE9; --muted:#8B9A94; --accent:#9BB0A4; --warn:#d9c25a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:8px 14px; border-bottom:1px solid var(--line);
  }
  header h1{font-size:15px;margin:0;font-weight:600}
  header .note{color:var(--muted);font-size:11px}
  header .spacer{flex:1}
  .wrap{flex:1 1 auto;display:grid;grid-template-columns:268px 1fr 280px;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
  aside.right{border-right:none;border-left:1px solid var(--line)}
  h2{font-size:12px;margin:14px 0 8px;color:var(--accent);letter-spacing:.4px;font-weight:600}
  h2:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{flex:0 0 72px;color:var(--muted);font-size:11px}
  .row input[type=number],.row input[type=text],.row select{
    flex:1;min-width:0;background:#080C0E;border:1px solid var(--line);
    color:var(--fg);padding:4px 6px;font-size:12px;border-radius:3px;
  }
  .row input[type=range]{flex:1;min-width:0}
  .row .val{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px;color:var(--fg)}
  button{
    background:#11181A;border:1px solid rgba(230,236,233,.22);color:var(--fg);
    padding:5px 9px;font-size:12px;border-radius:3px;cursor:pointer;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:#1E2A2B;border-color:var(--accent)}
  button.wide{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stat{font-size:11px;color:var(--muted);background:#080C0E;border:1px solid var(--line);padding:8px;border-radius:3px;white-space:pre-wrap}
  main{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:#05070A}
  #cv{max-width:100%;max-height:100%;box-shadow:0 0 0 1px rgba(230,236,233,.08)}
  #hud{
    position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);
    background:rgba(7,10,12,.82);padding:4px 8px;border-radius:3px;pointer-events:none
  }
  .hr{height:1px;background:var(--line);margin:12px 0}
  body.render header,body.render aside,body.render #hud{display:none}
  body.render .wrap{display:block}
  body.render main{display:block;background:#000}
  body.render #cv{max-width:none;max-height:none;box-shadow:none;display:block}
</style>
</head>
<body>

<header>
  <h1>织网实验台</h1>
  <span class="note">实测指纹 → 受约束重生成 → 曲线/场景导出（原型，不替代主程序）</span>
  <span class="spacer"></span>
  <span class="note" id="screenNote">—</span>
</header>

<div class="wrap">
<aside class="left">
  <h2>屏幕</h2>
  <div class="row"><label>面积 m²</label><input type="number" id="area" value="7.4" step="0.1"><span class="val">m²</span></div>
  <div class="row"><label>比例</label>
    <select id="aspectSel">
      <option value="16:9">16:9</option>
      <option value="2:1">2:1</option>
      <option value="1.85:1">1.85:1</option>
      <option value="4:3">4:3</option>
      <option value="1:1">1:1</option>
      <option value="9:16">9:16（竖）</option>
      <option value="custom">自定义</option>
    </select>
  </div>
  <div class="row"><label>宽 : 高</label>
    <input type="number" id="aspectW" value="16" step="0.01">
    <input type="number" id="aspectH" value="9" step="0.01">
  </div>
  <div class="row"><label>像素间距</label><input type="number" id="pitch" value="1.5" step="0.1"><span class="val">mm</span></div>
  <div class="stat" id="resStat">—</div>

  <h2>格网</h2>
  <div class="row"><label>列</label><input type="number" id="cols" value="10" min="2" max="24" step="1"><span class="val"></span></div>
  <div class="row"><label>行</label><input type="number" id="rows" value="6" min="2" max="18" step="1"><span class="val"></span></div>
  <div class="row"><label>边距</label><input type="range" id="margin" min="0" max="10" value="2.5" step="0.5"><span class="val" id="marginVal">2.5%</span></div>
  <div class="row"><label>层数</label><input type="range" id="strata" min="1" max="8" value="3" step="1"><span class="val" id="strataVal">3</span></div>

  <h2>生成</h2>
  <div class="row"><label>目标覆盖</label><input type="range" id="coverage" min="0.1" max="0.9" value="0.62" step="0.01"><span class="val" id="coverageVal">0.62</span></div>
  <div class="row"><label>每格蚕数</label><input type="range" id="worms" min="1" max="4" value="2" step="1"><span class="val" id="wormsVal">2</span></div>
  <div class="row"><label>循环幅度</label><input type="range" id="loopAmp" min="0.10" max="0.45" value="0.26" step="0.01"><span class="val" id="loopAmpVal">0.26</span></div>
  <div class="row"><label>贴壁权重</label><input type="range" id="wallAff" min="0" max="1" value="0.60" step="0.05"><span class="val" id="wallAffVal">0.60</span></div>
  <div class="row"><label>种子</label><input type="number" id="seed" value="20261116" step="1"><button type="button" id="reseed">换</button></div>

  <div class="hr"></div>
  <div class="grid2">
    <button type="button" class="primary" id="regen">重新生成</button>
    <button type="button" id="play">播放</button>
  </div>
  <div class="row"><label>进度</label><input type="range" id="prog" min="0" max="1" value="1" step="0.01"><span class="val" id="progVal">1.00</span></div>
  <div class="row"><label>时长</label><input type="range" id="dur" min="10" max="120" value="40" step="1"><span class="val" id="durVal">40s</span></div>
</aside>

<main>
  <canvas id="cv"></canvas>
  <div id="hud">预览分辨率 — </div>
</main>

<aside class="right">
  <h2>实测指纹</h2>
  <div class="stat" id="profileStat">演示指纹（非实测），仅用于联调。</div>
  <div class="row"><label>导入</label><input type="file" id="fileProfile" accept=".json" style="flex:1"></div>
  <p class="stat" id="profileNote" style="margin-top:6px">载入描图器「保存工程」的 trajectories.json 或 curves-3d.json，自动统计步长、转角、环数。未标定的 px 数据只作联调，不可进论文。</p>

  <h2>统计</h2>
  <div class="stat" id="runStat">—</div>

  <h2>导出</h2>
  <button type="button" class="wide" id="expSvg">导出曲线 SVG（mm）</button>
  <button type="button" class="wide" id="expCurves" style="margin-top:6px">导出曲线 JSON（含 u）</button>
  <button type="button" class="wide" id="expScene" style="margin-top:6px">导出场景 JSON（可复现）</button>
  <button type="button" class="wide" id="expPng" style="margin-top:6px">导出当前帧 PNG</button>
  <button type="button" class="wide" id="copyCmd" style="margin-top:6px">复制离线渲染命令</button>
  <p class="stat" style="margin-top:8px">母版出片走无头 Chrome 逐帧 + ffmpeg，见 <code>scripts/render_led_frames.ps1</code>。本页只做预览与单帧。</p>
</aside>
</div>

<script>
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= 配置 ================= */
const S = {
  areaM2: 7.4, aspectW: 16, aspectH: 9, pitchMM: 1.5,
  cols: 10, rows: 6, marginPct: 2.5, strata: 3,
  coverage: 0.62, worms: 2, seed: 20261116,
  loopAmp: 0.26, wallAff: 0.60, duration: 40,
  progress: 1, playing: false, showWalls: true,
  profile: null,
};

/* 演示指纹：没有实测数据时的联调占位，绝不能当论文依据 */
const DEMO_PROFILE = {
  id: 'demo', label: '演示指纹（非实测）',
  stepMean: 1.8, stepSD: 0.30, curveAmp: 0.26,
  maxTurn: 0.72, noise: 0.045, phaseStep: 0.020, loopsHint: 2.4,
};
S.profile = { ...DEMO_PROFILE };

/* ================= 随机数 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rng) {
  let u = 0, v = 0;
  while (!u) u = rng();
  while (!v) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}

/* ================= 几何：SDF ================= */
function cellSDF(cell, x, y) {
  const lx = x - (cell.x + cell.w / 2), ly = y - (cell.y + cell.h / 2);
  let d = Math.max(Math.abs(lx) - cell.w / 2, Math.abs(ly) - cell.h / 2);
  if (cell.notch) {
    const nx = x - cell.notch.cx, ny = y - cell.notch.cy;
    d = Math.max(d, -(Math.hypot(nx, ny) - cell.notch.r));
  }
  if (cell.island) {
    const ix = x - cell.island.cx, iy = y - cell.island.cy;
    d = Math.max(d, -(Math.hypot(ix, iy) - cell.island.r));
  }
  return d;
}
function sdfGrad(cell, x, y, e) {
  const h = e || 1.0;
  return {
    dx: (cellSDF(cell, x + h, y) - cellSDF(cell, x - h, y)) / (2 * h),
    dy: (cellSDF(cell, x, y + h) - cellSDF(cell, x, y - h)) / (2 * h),
  };
}

/* ================= 场景构建 ================= */
function cellId(c, r) { return String.fromCharCode(65 + c) + (r + 1); }

function buildScene() {
  const t0 = performance.now();
  const areaMM = S.areaM2 * 1e6;
  const aspect = S.aspectW / S.aspectH;
  const W = Math.sqrt(areaMM * aspect);
  const H = W / aspect;

  const margin = Math.max(6, Math.min(W, H) * S.marginPct / 100);
  const cw = (W - 2 * margin) / S.cols;
  const ch = (H - 2 * margin) / S.rows;

  const seedRng = mulberry32(S.seed);
  const cells = [];
  for (let r = 0; r < S.rows; r++) {
    for (let c = 0; c < S.cols; c++) {
      const x = margin + c * cw, y = margin + r * ch;
      const cell = { id: cellId(c, r), x, y, w: cw, h: ch, type: 'plain' };
      const t = seedRng();
      if (t < 0.20) cell.type = 'notch';
      else if (t < 0.52) cell.type = 'notchIsland';
      else if (t < 0.70) cell.type = 'island';

      if (cell.type === 'notch' || cell.type === 'notchIsland') {
        const corner = Math.floor(seedRng() * 4);
        cell.notch = {
          corner,
          cx: x + (corner % 2 === 1 ? cw : 0),
          cy: y + (corner < 2 ? 0 : ch),
          r: Math.min(cw, ch) * (0.26 + seedRng() * 0.24),
        };
      }
      if (cell.type === 'island' || cell.type === 'notchIsland') {
        cell.island = {
          cx: x + cw * (0.30 + seedRng() * 0.40),
          cy: y + ch * (0.30 + seedRng() * 0.40),
          r: Math.min(cw, ch) * (0.14 + seedRng() * 0.13),
        };
      }
      cell.target = clamp(S.coverage + (seedRng() - 0.5) * 0.46, 0.06, 0.88);
      cell.seed = Math.floor(seedRng() * 1e9);

      const L = Math.min(cw, ch);
      cell.contour = contourPolylines(cell, Math.max(1.2, L / 70));
      cell.grid = prepareGrid(cell, Math.max(1.4, L / 96));
      cells.push(cell);
    }
  }

  const strata = [];
  for (let s = 0; s < S.strata; s++) {
    const paths = [];
    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      const rng = mulberry32(cell.seed + s * 7919 + 13);
      for (let w = 0; w < S.worms; w++) {
        const p = growInCell(cell, S.profile, rng, s, w);
        if (p) paths.push(p);
      }
    }
    strata.push({
      index: s,
      alpha: S.strata === 1 ? 0.62 : 0.16 + 0.40 * (s / (S.strata - 1)),
      paths,
    });
  }

  let pts = 0, len = 0, covSum = 0, covN = 0;
  strata.forEach(st => st.paths.forEach(p => {
    pts += p.pts.length; len += p.length; covSum += p.coverage; covN++;
  }));
  const stats = {
    W, H, cells: cells.length, strata: S.strata, worms: cells.length * S.worms,
    points: pts, lengthMM: len, coverageAvg: covN ? covSum / covN : 0,
    ms: Math.round(performance.now() - t0),
  };
  return { W, H, cells, strata, stats, margin };
}

/* 允许面积网格（与占用网格同分辨率） */
function prepareGrid(cell, res) {
  const nx = Math.max(2, Math.ceil(cell.w / res));
  const ny = Math.max(2, Math.ceil(cell.h / res));
  const allow = new Uint8Array(nx * ny);
  let count = 0;
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const x = cell.x + (i + 0.5) * res, y = cell.y + (j + 0.5) * res;
      if (cellSDF(cell, x, y) < -res) { allow[j * nx + i] = 1; count++; }
    }
  }
  return { res, nx, ny, allow, count: Math.max(1, count) };
}

/* ================= 生长（按格尺度归一化） ================= */
function growInCell(cell, profile, rng, stratum, wormIdx) {
  const g = cell.grid;
  const { res, nx, ny } = g;
  const occ = new Uint8Array(nx * ny);
  let occN = 0;

  const idx = (x, y) => {
    const i = Math.floor((x - cell.x) / res), j = Math.floor((y - cell.y) / res);
    if (i < 0 || j < 0 || i >= nx || j >= ny) return -1;
    return j * nx + i;
  };
  const isFree = (x, y) => {
    const k = idx(x, y);
    if (k < 0) return false;
    if (occ[k]) return false;
    return g.allow[k] === 1;
  };
  const mark = (x, y, rad) => {
    const r = Math.ceil(rad / res);
    const i0 = Math.floor((x - cell.x) / res), j0 = Math.floor((y - cell.y) / res);
    for (let j = j0 - r; j <= j0 + r; j++) {
      for (let i = i0 - r; i <= i0 + r; i++) {
        if (i < 0 || j < 0 || i >= nx || j >= ny) continue;
        const px = cell.x + (i + 0.5) * res, py = cell.y + (j + 0.5) * res;
        if (cellSDF(cell, px, py) >= -0.6) continue;
        if ((px - x) * (px - x) + (py - y) * (py - y) > rad * rad) continue;
        const k = j * nx + i;
        if (!occ[k]) { occ[k] = 1; occN++; }
      }
    }
  };

  const L = Math.min(cell.w, cell.h);

  // 尺度归一：真实步长按 90 mm 标称格折算，环半径固定为格宽的 8.5%
  const U = L / 90;
  const stepLen = Math.max(0.5 * res, 2.0 * U * (profile.stepMean / 1.8));
  const loopR = L * 0.085;
  const amp = clamp(stepLen / loopR, 0.06, 0.5);
  const wallBand = L * 0.06;
  const markR = Math.max(1.0, stepLen * 0.65);
  const ahead = stepLen * 2.4;

  // 起点：贴壁带内
  let sx = 0, sy = 0, found = false;
  for (let tries = 0; tries < 800 && !found; tries++) {
    const x = cell.x + rng() * cell.w, y = cell.y + rng() * cell.h;
    const d = cellSDF(cell, x, y);
    if (d > -wallBand && d < -res * 1.6) { sx = x; sy = y; found = true; }
  }
  if (!found) return null;

  const g0 = sdfGrad(cell, sx, sy);
  let heading = Math.atan2(-g0.dy, -g0.dx) + (rng() - 0.5) * 1.2;

  let x = sx, y = sy, phase = rng() * TAU, stuck = 0, steps = 0;
  const pts = [{ x, y }];
  mark(x, y, markR);

  /* 转角从实测直方图采样（markov-turn），oscillator 只做兜底 */
  const hist = Array.isArray(profile.turnHist) && profile.turnHist.length === 36 ? profile.turnHist : null;
  const sampleTurn = () => {
    if (!hist) return 0;
    let r = rng(), acc = 0;
    for (let i = 0; i < 36; i++) {
      acc += hist[i];
      if (r <= acc) return ((i + 0.5) / 36) * Math.PI;
    }
    return Math.PI * 0.5;
  };
  let turnSign = rng() < 0.5 ? 1 : -1;
  let runLeft = Math.max(2, Math.round((profile.turnSignPersistence || 3) * 0.7));

  const maxSteps = Math.round((cell.target * g.count * res * res) / (stepLen * markR * 2) * 1.8) + 400;
  const targetN = Math.min(g.count, Math.round(cell.target * g.count));

  while (steps < Math.max(600, maxSteps) && occN < targetN && stuck < 120) {
    steps++;
    phase += (profile.phaseStep || 0.02);

    runLeft -= 1;
    if (runLeft <= 0) {
      turnSign = -turnSign;
      runLeft = Math.max(2, Math.round((profile.turnSignPersistence || 3) * (0.6 + rng() * 0.8)));
    }

    const histTurn = hist ? sampleTurn() : 0;
    let desired = heading
      + (hist ? turnSign * histTurn * 0.55 : 0)
      + amp * Math.cos(phase) * (hist ? 0.45 : 1)
      + (profile.noise || 0.04) * gauss(rng);

    // 贴壁：靠近壁时叠加切向
    const d0 = cellSDF(cell, x, y);
    if (d0 > -wallBand) {
      const gd = sdfGrad(cell, x, y);
      const tx = -gd.dy, ty = gd.dx;
      const sgn = (Math.cos(heading) * tx + Math.sin(heading) * ty) >= 0 ? 1 : -1;
      const angT = Math.atan2(sgn * ty, sgn * tx);
      desired += S.wallAff * clamp(1 - (-d0) / wallBand, 0, 1) * angDiff(angT, desired);
    }

    // 候选方向打分：空 + 贴壁 + 转角小
    const cands = [0, 0.12, -0.12, 0.26, -0.26, 0.42, -0.42, 0.58, -0.58];
    let bestA = null, bestScore = -1e9;
    for (let k = 0; k < cands.length; k++) {
      const a = desired + cands[k];
      if (Math.abs(angDiff(a, heading)) > profile.maxTurn) continue;
      const px = x + Math.cos(a) * ahead, py = y + Math.sin(a) * ahead;
      const sd = cellSDF(cell, px, py);
      if (sd > -res * 0.8) continue;
      const free = isFree(px, py) ? 1 : 0;
      const band = (sd > -wallBand) ? 1 : 0;
      const score = free * 3.2 + band * S.wallAff * 0.5 - Math.abs(cands[k]) * 0.9;
      if (score > bestScore) { bestScore = score; bestA = a; }
    }

    if (bestA === null) { heading += (rng() < 0.5 ? 1 : -1) * 0.55; stuck++; continue; }

    heading = bestA;
    const nx2 = x + Math.cos(heading) * stepLen;
    const ny2 = y + Math.sin(heading) * stepLen;
    if (cellSDF(cell, nx2, ny2) > -0.8) { stuck++; continue; }

    x = nx2; y = ny2;
    pts.push({ x, y });
    mark(x, y, markR);
    stuck = 0;
  }

  const simp = simplify(pts, Math.max(0.15, stepLen * 0.12));
  let length = 0;
  const cum = [0];
  for (let i = 1; i < simp.length; i++) {
    length += Math.hypot(simp[i].x - simp[i - 1].x, simp[i].y - simp[i - 1].y);
    cum.push(length);
  }
  const ptsU = simp.map((p, i) => ({
    x: +p.x.toFixed(2), y: +p.y.toFixed(2),
    u: length ? +(cum[i] / length).toFixed(4) : 0,
  }));

  return {
    cell: cell.id, stratum, worm: wormIdx + 1,
    pts: ptsU, cum, length,
    coverage: occN / g.count,
  };
}

/* ================= 折线简化 ================= */
function simplify(pts, tol) {
  if (pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length);
  keep[0] = 1; keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const seg = stack.pop();
    const a = seg[0], b = seg[1];
    let maxD = -1, maxI = -1;
    const ax = pts[a].x, ay = pts[a].y, bx = pts[b].x, by = pts[b].y;
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
    for (let i = a + 1; i < b; i++) {
      const d = Math.abs((pts[i].x - ax) * dy - (pts[i].y - ay) * dx) / L;
      if (d > maxD) { maxD = d; maxI = i; }
    }
    if (maxD > tol && maxI > 0) {
      keep[maxI] = 1;
      stack.push([a, maxI], [maxI, b]);
    }
  }
  return pts.filter((_, i) => keep[i]);
}

/* ================= 等值线（marching squares） ================= */
function contourPolylines(cell, step) {
  const x0 = cell.x - 1.2, y0 = cell.y - 1.2;
  const x1 = cell.x + cell.w + 1.2, y1 = cell.y + cell.h + 1.2;
  const nx = Math.ceil((x1 - x0) / step) + 1;
  const ny = Math.ceil((y1 - y0) / step) + 1;
  const v = new Float32Array(nx * ny);
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      v[j * nx + i] = cellSDF(cell, x0 + i * step, y0 + j * step);
    }
  }
  const segs = [];
  const P = (i, j) => ({ x: x0 + i * step, y: y0 + j * step });
  const ip = (a, b, va, vb) => {
    const t = va / (va - vb);
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  };
  for (let j = 0; j < ny - 1; j++) {
    for (let i = 0; i < nx - 1; i++) {
      const v00 = v[j * nx + i], v10 = v[j * nx + i + 1];
      const v01 = v[(j + 1) * nx + i], v11 = v[(j + 1) * nx + i + 1];
      let code = 0;
      if (v00 < 0) code |= 1;
      if (v10 < 0) code |= 2;
      if (v11 < 0) code |= 4;
      if (v01 < 0) code |= 8;
      if (code === 0 || code === 15) continue;
      const a = P(i, j), b = P(i + 1, j), c = P(i + 1, j + 1), d = P(i, j + 1);
      const top = () => ip(a, b, v00, v10);
      const right = () => ip(b, c, v10, v11);
      const bottom = () => ip(d, c, v01, v11);
      const left = () => ip(a, d, v00, v01);
      switch (code) {
        case 1: case 14: segs.push([left(), top()]); break;
        case 2: case 13: segs.push([top(), right()]); break;
        case 3: case 12: segs.push([left(), right()]); break;
        case 4: case 11: segs.push([right(), bottom()]); break;
        case 6: case 9: segs.push([top(), bottom()]); break;
        case 7: case 8: segs.push([left(), bottom()]); break;
        case 5: {
          const cen = (v00 + v10 + v11 + v01) / 4;
          if (cen < 0) { segs.push([left(), top()]); segs.push([right(), bottom()]); }
          else { segs.push([top(), right()]); segs.push([bottom(), left()]); }
          break;
        }
        case 10: {
          const cen = (v00 + v10 + v11 + v01) / 4;
          if (cen < 0) { segs.push([top(), right()]); segs.push([bottom(), left()]); }
          else { segs.push([left(), top()]); segs.push([right(), bottom()]); }
          break;
        }
      }
    }
  }
  return chainSegs(segs);
}

function chainSegs(segs) {
  if (!segs.length) return [];
  const key = p => `${Math.round(p.x * 16)}:${Math.round(p.y * 16)}`;
  const map = new Map();
  segs.forEach((s, i) => {
    [s[0], s[1]].forEach(p => {
      const k = key(p);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(i);
    });
  });
  const used = new Uint8Array(segs.length);
  const out = [];
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    used[i] = 1;
    const line = [segs[i][0], segs[i][1]];
    for (let guard = 0; guard < 300; guard++) {
      const endK = key(line[line.length - 1]);
      const cands = (map.get(endK) || []).filter(j => !used[j]);
      if (!cands.length) break;
      const j = cands[0];
      used[j] = 1;
      const s = segs[j];
      line.push(key(s[0]) === endK ? s[1] : s[0]);
    }
    for (let guard = 0; guard < 300; guard++) {
      const startK = key(line[0]);
      const cands = (map.get(startK) || []).filter(j => !used[j]);
      if (!cands.length) break;
      const j = cands[0];
      used[j] = 1;
      const s = segs[j];
      line.unshift(key(s[0]) === startK ? s[1] : s[0]);
    }
    if (line.length > 1) {
      const closed = key(line[0]) === key(line[line.length - 1]);
      if (closed && line.length > 4) {
        /* 闭合轮廓：先去掉重复的收尾点再简化，最后显式补回闭合点，
           否则首尾同点会让 DP 退化成 2 个重合点，画出来是空的 */
        const open = line.slice(0, -1);
        const simp = simplify(open, 0.3);
        simp.push({ x: simp[0].x, y: simp[0].y });
        out.push(simp);
      } else {
        out.push(simplify(line, 0.3));
      }
    }
  }
  return out;
}

/* ================= 渲染 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scene = null;
let rafId = 0;
let lastTick = 0;

function fitCanvas(cssW, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(2, Math.floor(cssW));
  const h = Math.max(2, Math.floor(cssH));
  if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
  }
}

function resizedPreview() {
  if (!scene) return;
  const host = cv.parentElement;
  const availW = host.clientWidth - 24;
  const availH = host.clientHeight - 24;
  const ar = scene.W / scene.H;
  let w = availW, h = w / ar;
  if (h > availH) { h = availH; w = h * ar; }
  fitCanvas(w, h);
  render();
}

function drawPolyline(pts, cum, upto, alpha, widthMM, scale) {
  if (!pts.length) return;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < pts.length; i++) {
    if (upto != null && cum[i] > upto) {
      if (!started) return;
      break;
    }
    const px = pts[i].x * scale, py = pts[i].y * scale;
    if (!started) { ctx.moveTo(px, py); started = true; }
    else ctx.lineTo(px, py);
  }
  ctx.globalAlpha = alpha;
  ctx.lineWidth = Math.max(0.7, widthMM * scale);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function render() {
  if (!scene) return;
  const scale = cv.width / scene.W;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05070A';
  ctx.fillRect(0, 0, cv.width, cv.height);

  if (S.showWalls) {
    ctx.strokeStyle = 'rgba(196,214,204,0.50)';
    ctx.lineWidth = Math.max(1.0, 1.6 * scale);
    scene.cells.forEach(cell => {
      cell.contour.forEach(line => {
        ctx.beginPath();
        for (let i = 0; i < line.length; i++) {
          const px = line[i].x * scale, py = line[i].y * scale;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      });
    });
  }

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(230,238,232,1)';
  scene.strata.forEach(st => {
    st.paths.forEach(p => {
      const widthMM = (2.2 + st.index * 0.35) * S.pitchMM;
      drawPolyline(p.pts, p.cum, S.progress * p.length, st.alpha, widthMM, scale);
    });
  });

  const hud = document.getElementById('hud');
  if (hud) {
    hud.textContent = `预览 ${cv.width}×${cv.height} px · 场地 ${scene.W.toFixed(0)}×${scene.H.toFixed(0)} mm · 进度 ${(S.progress * 100).toFixed(0)}%`;
  }
}

/* ================= 播放 ================= */
function loop(ts) {
  if (!S.playing) return;
  if (!lastTick) lastTick = ts;
  const dt = (ts - lastTick) / 1000;
  lastTick = ts;
  S.progress += dt / S.duration;
  if (S.progress >= 1) S.progress = 0;
  const prog = document.getElementById('prog');
  prog.value = String(S.progress);
  document.getElementById('progVal').textContent = S.progress.toFixed(2);
  render();
  rafId = requestAnimationFrame(loop);
}

function setPlaying(on) {
  S.playing = on;
  document.getElementById('play').textContent = on ? '暂停' : '播放';
  if (on) { lastTick = 0; S.progress = 0; rafId = requestAnimationFrame(loop); }
  else { cancelAnimationFrame(rafId); render(); }
}

/* ================= 参数绑定 ================= */
function ranged(id, key, fmt, isInt) {
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'Val');
  el.addEventListener('input', () => {
    const v = isInt ? parseInt(el.value, 10) : parseFloat(el.value);
    S[key] = v;
    if (out) out.textContent = fmt ? fmt(v) : v;
    schedule();
  });
}

let timer = 0;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => regenerate(), 260);
}

function applyAspect() {
  const sel = document.getElementById('aspectSel').value;
  if (sel !== 'custom') {
    const parts = sel.split(':');
    S.aspectW = parseFloat(parts[0]);
    S.aspectH = parseFloat(parts[1]);
    document.getElementById('aspectW').value = String(S.aspectW);
    document.getElementById('aspectH').value = String(S.aspectH);
  }
  schedule();
}

function screenBlock() {
  const areaMM = S.areaM2 * 1e6;
  const aspect = S.aspectW / S.aspectH;
  const W = Math.sqrt(areaMM * aspect), H = W / aspect;
  return {
    areaM2: S.areaM2, aspect: [S.aspectW, S.aspectH],
    pitchMM: S.pitchMM,
    widthMM: +W.toFixed(1), heightMM: +H.toFixed(1),
    nativePx: [Math.round(W / S.pitchMM), Math.round(H / S.pitchMM)],
  };
}

function updateScreenStat() {
  const b = screenBlock();
  const pxW = b.nativePx[0], pxH = b.nativePx[1];
  document.getElementById('resStat').textContent =
    `屏体 ${(b.widthMM / 1000).toFixed(2)} × ${(b.heightMM / 1000).toFixed(2)} m\n原生 ${pxW} × ${pxH} px（${(pxW * pxH / 1e6).toFixed(2)} MP）`;
  document.getElementById('screenNote').textContent = `${pxW}×${pxH} @ P${S.pitchMM}`;
}

function regenerate() {
  updateScreenStat();
  scene = buildScene();
  resizedPreview();
  render();
  updateStats();
}

function updateStats() {
  const st = scene.stats;
  const prof = S.profile;
  document.getElementById('runStat').textContent =
    `格 ${st.cells} · 层 ${st.strata} · 每层蚕 ${st.worms}\n` +

}

/* ================= 指纹：从实测轨迹统计 ================= */
/* ================= 运动指纹（按 silkworm-motion-profile/v1 统计） ================= */
function statsMedian(arr) {
  if (!arr.length) return 0;
  const s = arr.slice().sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}
function statsPct(arr, p) {
  if (!arr.length) return 0;
  const s = arr.slice().sort((a, b) => a - b);
  return s[Math.min(s.length - 1, Math.max(0, Math.floor(s.length * p)))];
}
/* 简化折线的自交次数：用来估「一次包络里绕了几圈」 */
function countCrossings(pts) {
  const n = Math.min(pts.length, 260);
  if (n < 4) return 0;
  const stride = Math.max(1, Math.floor(pts.length / n));
  const P = [];
  for (let i = 0; i < pts.length; i += stride) P.push(pts[i]);
  const orient = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  const segHit = (a, b, c, d) => {
    const o1 = orient(a, b, c), o2 = orient(a, b, d);
    const o3 = orient(c, d, a), o4 = orient(c, d, b);
    return o1 * o2 < 0 && o3 * o4 < 0;
  };
  let hits = 0;
  for (let i = 0; i < P.length - 1; i++) {
    for (let j = i + 2; j < P.length - 1; j++) {
      if (i === 0 && j === P.length - 2) continue;
      if (segHit(P[i], P[i + 1], P[j], P[j + 1])) hits++;
    }
  }
  return hits;
}

function profileFromPoints(points, label, calibrated, wormId) {
  const pts = points.filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
  if (pts.length < 8) return null;

  const steps = [], turns = [], signed = [];
  for (let i = 1; i < pts.length; i++) {
    const ds = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    steps.push(ds);
    if (i > 1) {
      const a1 = Math.atan2(pts[i - 1].y - pts[i - 2].y, pts[i - 1].x - pts[i - 2].x);
      const a2 = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
      const d = angDiff(a2, a1);
      turns.push(Math.abs(d));
      signed.push(d);
    }
  }

  const moving = steps.filter(v => v > 1e-6);
  const stepMean = statsMedian(moving) || 1.8;
  const stepSD = statsPct(moving, 0.25) || 0;
  const pauseThr = stepMean * 0.25;
  const pauseRate = steps.length ? steps.filter(v => v < pauseThr).length / steps.length : 0;

  /* 36 桶转角直方图，覆盖 [0, π]，归一化为概率 */
  const hist = new Array(36).fill(0);
  turns.forEach(t => {
    const b = Math.min(35, Math.max(0, Math.floor((t / Math.PI) * 36)));
    hist[b] += 1;
  });
  const hSum = hist.reduce((a, b) => a + b, 0) || 1;
  for (let i = 0; i < 36; i++) hist[i] = +(hist[i] / hSum).toFixed(5);

  /* 转向持续性：连续同向转角的平均游程 */
  let runs = 0, runLen = 0, lastSign = 0, acc = 0;
  signed.forEach(d => {
    if (Math.abs(d) < 0.02) return;
    const s = d > 0 ? 1 : -1;
    if (s === lastSign) runLen += 1;
    else {
      if (runLen > 0) { acc += runLen; runs += 1; }
      runLen = 1; lastSign = s;
    }
  });
  if (runLen > 0) { acc += runLen; runs += 1; }
  const turnSignPersistence = runs ? +(acc / runs).toFixed(2) : 1;

  /* 曲率半径：R = ds / dθ，极短段与极小转角丢弃 */
  const radii = [];
  for (let i = 2; i < pts.length; i++) {
    const ds = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    const th = Math.abs(turns[i - 2] || 0);
    if (ds > stepMean * 0.3 && th > 1e-3) radii.push(ds / th);
  }
  const radiusTyp = +(statsMedian(radii) || 0).toFixed(2);
  const radiusMin = +(statsPct(radii, 0.05) || 0).toFixed(2);

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  pts.forEach(p => {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  });
  const bbox = [maxX - minX, maxY - minY];

  const simp = simplify(pts, Math.max(0.4, stepMean * 0.7));
  const loopsPerEnvelope = countCrossings(simp);

  const curveAmp = clamp(statsMedian(turns) || 0.22, 0.06, 0.5);
  const maxTurn = clamp(statsPct(turns, 0.95) || 0.6, 0.2, 1.2);
  const tag = (calibrated ? '实测指纹 · ' : '未标定（px）· ') + label;

  const profile = {
    schema: 'silkworm-motion-profile/v1',
    wormId: Number.isFinite(wormId) ? Math.max(1, Math.round(wormId)) : 1,
    label: tag,
    source: {
      kind: 'measured',
      project: label,
      calibrated: !!calibrated,
      assumed: ['wallAffinity'],
      note: calibrated ? '长度单位 mm' : '长度单位 px（未标定，只能联调）',
    },
    fingerprint: {
      stepMean: +stepMean.toFixed(3),
      stepSD: +stepSD.toFixed(3),
      turnHist: hist,
      turnSignPersistence,
      maxTurn: +maxTurn.toFixed(3),
      curveAmp: +curveAmp.toFixed(3),
      radiusTyp,
      radiusMin,
      pauseRate: +pauseRate.toFixed(3),
      wallAffinity: 0.5,
      loopsPerEnvelope,
      bbox: [+bbox[0].toFixed(2), +bbox[1].toFixed(2)],
    },
    sampler: { type: 'histogram', seed: S.seed, temperature: 0.35 },
  };

  /* 兼容生成器使用的扁平字段 */
  Object.assign(profile, {
    id: 'profile-' + profile.wormId + '-' + Date.now(),
    stepMean: profile.fingerprint.stepMean,
    stepSD: profile.fingerprint.stepSD,
    curveAmp: profile.fingerprint.curveAmp,
    maxTurn: profile.fingerprint.maxTurn,
    turnHist: profile.fingerprint.turnHist,
    turnSignPersistence: profile.fingerprint.turnSignPersistence,
    radiusTyp: profile.fingerprint.radiusTyp,
    loopsPerEnvelope: profile.fingerprint.loopsPerEnvelope,
    phaseStep: 0.020,
    noise: 0.045,
    loopsHint: +(TAU / Math.max(0.3, curveAmp * 30)).toFixed(2),
  });
  return profile;
}

function adoptProfile(prof, calibrated, seriesCount, srcLabel) {
  S.profile = prof;
  S.loopAmp = prof.curveAmp;
  document.getElementById('loopAmp').value = String(prof.curveAmp);
  document.getElementById('loopAmpVal').textContent = prof.curveAmp.toFixed(2);
  regenerate();

  const f = prof.fingerprint || prof;
  const kind = (prof.source && prof.source.kind) || 'measured';
  const assumed = (prof.source && prof.source.assumed) || [];
  document.getElementById('profileStat').textContent =
    `${kind === 'measured' ? '实测指纹' : '假设指纹'} · 步长 ${f.stepMean}${calibrated ? 'mm' : 'px'} ± ${f.stepSD || 0}` +
    ` · 典型半径 ${f.radiusTyp ?? '—'} · 环数 ${f.loopsPerEnvelope ?? '—'}` +
    ` · 转向持续 ${f.turnSignPersistence ?? '—'} · 停顿率 ${f.pauseRate ?? '—'}` +
    (assumed.length ? ` · 假设项：${assumed.join('/')}` : '');
  document.getElementById('profileNote').textContent = calibrated
    ? `已载入 ${seriesCount} 条曲线，指纹来自最长一条，单位为 mm，可用于论文与展陈。`
    : `已载入 ${seriesCount} 条曲线，未标定：数值仍为像素，只能联调，不能进论文。来源：${srcLabel}`;
}

function loadProfileFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try { data = JSON.parse(reader.result); } catch (e) { alert('JSON 解析失败'); return; }

    /* 已经是 profile 契约：直接用 */
    if (data && data.schema === 'silkworm-motion-profile/v1' && data.fingerprint) {
      const f = data.fingerprint;
      const prof = Object.assign({}, data, {
        id: data.id || ('profile-' + (data.wormId || 1) + '-' + Date.now()),
        label: data.label || ('蚕 ' + (data.wormId || 1)),
        stepMean: f.stepMean,
        stepSD: f.stepSD,
        curveAmp: f.curveAmp,
        maxTurn: f.maxTurn,
        turnHist: f.turnHist,
        turnSignPersistence: f.turnSignPersistence,
        radiusTyp: f.radiusTyp,
        loopsPerEnvelope: f.loopsPerEnvelope,
        phaseStep: 0.020,
        noise: 0.045,
      });
      adoptProfile(prof, !!(data.source && data.source.calibrated), 1, data.source && data.source.project || data.label || 'profile.json');
      return;
    }

    const series = [];
    let calibrated = false;

    if (Array.isArray(data.silkworms)) {
      data.silkworms.forEach(sw => {
        const pts = (sw.points || []).map(p => {
          const x = Number.isFinite(p.x_mm) ? p.x_mm : p.x_px;
          const y = Number.isFinite(p.y_mm) ? p.y_mm : p.y_px;
          if (Number.isFinite(p.x_mm)) calibrated = true;
          return { x, y };
        });
        if (pts.length) series.push({ pts, id: sw.id });
      });
    }
    if (!series.length && Array.isArray(data.curves)) {
      data.curves.forEach((c, i) => {
        const pts = (c.points || []).map(p => ({ x: p.x_mm, y: p.y_mm }));
        if (pts.length) { series.push({ pts, id: c.name || i + 1 }); calibrated = true; }
      });
    }
    if (!series.length && Array.isArray(data.unifiedTrajectories)) {
      data.unifiedTrajectories.forEach((t, i) => {
        const pts = (t.points || []).map(p => ({ x: p.x_mm, y: p.y_mm }));
        if (pts.length) { series.push({ pts, id: t.wormId || i + 1 }); calibrated = true; }
      });
    }
    if (!series.length) { alert('未找到 silkworms / curves / unifiedTrajectories / profile 契约'); return; }

    series.sort((a, b) => b.pts.length - a.pts.length);
    const prof = profileFromPoints(
      series[0].pts,
      `蚕 ${series[0].id}（${series[0].pts.length} 点）`,
      calibrated,
      Number(series[0].id)
    );
    if (!prof) { alert('轨迹点太少（<8），无法统计指纹'); return; }
    adoptProfile(prof, calibrated, series.length, file.name);
  };
  reader.readAsText(file, 'utf-8');
}

/* ================= 导出 ================= */
function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function exportSVG() {
  if (!scene) return;
  const wallPaths = [];
  scene.cells.forEach(cell => {
    cell.contour.forEach(line => {
      wallPaths.push(line.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join(' '));
    });
  });
  const silkGroups = scene.strata.map(st => {
    const paths = st.paths.map(p => {
      const d = p.pts.map((q, i) => (i ? 'L' : 'M') + q.x.toFixed(2) + ' ' + q.y.toFixed(2)).join(' ');
      return `<path d="${d}" fill="none" stroke="#E4EEE8" stroke-width="1" stroke-linecap="round"/>`;
    }).join('\n');
    return `<g opacity="${st.alpha.toFixed(2)}">\n${paths}\n</g>`;
  }).join('\n');
  const walls = `<g opacity="0.35" stroke="#9EB0A8" stroke-width="0.8" fill="none">\n${wallPaths.map(d => `<path d="${d}"/>`).join('\n')}\n</g>`;
  const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${scene.W.toFixed(1)}mm" height="${scene.H.toFixed(1)}mm" viewBox="0 0 ${scene.W.toFixed(1)} ${scene.H.toFixed(1)}">
<metadata>${JSON.stringify({
    schema: 'silkworm-weave-svg/v1', generator: 'weave-lab', seed: S.seed,
    note: '单位 mm；原点在屏体左上角', profile: S.profile.label,
  }).replace(/</g, '&lt;')}</metadata>
${walls}
${silkGroups}
</svg>`;
  download('weave-curves.svg', svg, 'image/svg+xml');
}

function curvesPayload() {
  const curves = [];
  scene.strata.forEach(st => st.paths.forEach(p => {
    curves.push({
      id: `${p.cell}-s${p.stratum}-w${p.worm}`,
      cell: p.cell, stratum: p.stratum, worm: p.worm,
      unit: 'mm', length_mm: +p.length.toFixed(2),
      width_mm: +((2.2 + p.stratum * 0.35) * S.pitchMM).toFixed(2),
      coverage: +p.coverage.toFixed(3),
      points: p.pts,
    });
  }));
  return {
    schema: 'silkworm-weave-curves/v1',
    generator: 'weave-lab',
    profile: {
      id: S.profile.id, label: S.profile.label, stepMean: S.profile.stepMean,
      curveAmp: S.profile.curveAmp, maxTurn: S.profile.maxTurn,
      source: S.profile.source || null, sampler: S.profile.sampler || null,
      fingerprint: S.profile.fingerprint || null,
    },
    screen: screenBlock(),
    seed: S.seed, strata: S.strata,
    note: 'x/y 为 mm；u 为弧长参数 0→1；width_mm 仅供 sweep/tube。',
    curves,
  };
}

function exportCurves() {
  if (!scene) return;
  download('weave-curves.json', JSON.stringify(curvesPayload(), null, 2), 'application/json');
}

function scenePayload() {
  const cells = scene.cells.map(c => ({
    id: c.id, x: +c.x.toFixed(2), y: +c.y.toFixed(2),
    w: +c.w.toFixed(2), h: +c.h.toFixed(2), type: c.type,
    notch: c.notch || null, island: c.island || null,
    targetCoverage: +c.target.toFixed(3), seed: c.seed,
    contourPoints: c.contour.reduce((n, l) => n + l.length, 0),
  }));
  return {
    schema: 'silkworm-weave-scene/v1',
    generator: 'weave-lab',
    config: {
      areaM2: S.areaM2, aspectW: S.aspectW, aspectH: S.aspectH,
      pitchMM: S.pitchMM, cols: S.cols, rows: S.rows,
      marginPct: S.marginPct, strata: S.strata, coverage: S.coverage,
      worms: S.worms, seed: S.seed, loopAmp: S.loopAmp, wallAff: S.wallAff,
      duration: S.duration,
    },
    profile: S.profile,
    profiles: [S.profile],
    sampler: S.profile.sampler || { type: 'histogram', seed: S.seed, temperature: 0.35 },
    screen: screenBlock(),
    cells,
    note: 'cells 为几何真源（mm）；同一 config+seed 可像素级复现；SDF 由 cells 派生。',
  };
}

function exportScene() {
  if (!scene) return;
  download('weave-scene.json', JSON.stringify(scenePayload(), null, 2), 'application/json');
}

function exportPng() {
  if (!scene) return;
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `weave-frame-p${Math.round(S.progress * 100)}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
}

function cfgB64() {
  const cfg = {
    areaM2: S.areaM2, aspectW: S.aspectW, aspectH: S.aspectH, pitchMM: S.pitchMM,
    cols: S.cols, rows: S.rows, marginPct: S.marginPct, strata: S.strata,
    coverage: S.coverage, worms: S.worms, seed: S.seed, loopAmp: S.loopAmp,
    wallAff: S.wallAff, profile: S.profile,
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
}

function copyCmd() {
  const b = screenBlock();
  const cmd = `powershell -ExecutionPolicy Bypass -File "scripts\\render_led_frames.ps1" -Native "${b.nativePx[0]}x${b.nativePx[1]}" -Frames 900 -Fps 30 -Cfg "${cfgB64()}"`;
  navigator.clipboard.writeText(cmd).then(
    () => alert('已复制渲染命令（在仓库根目录执行）'),
    () => alert('复制失败，请手动选中：\n' + cmd)
  );
}

/* ================= 原生分辨率渲染（供无头 Chrome 抓帧） ================= */
function nativeMode(query) {
  const cfg = query.get('cfg');
  if (cfg) {
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(cfg))));
      Object.keys(o).forEach(k => {
        if (k === 'profile') S.profile = o.profile;
        else if (typeof S[k] === 'number') S[k] = o[k];
      });
    } catch (e) { /* 配置坏了就用默认 */ }
  }

  /* 便于确定性测试与批量对比：?seed=&cov=&worms=&strata=&cols=&rows=&area= */
  const num = (k, target, lo, hi) => {
    const v = parseFloat(query.get(k));
    if (Number.isFinite(v)) S[target] = clamp(v, lo, hi);
  };
  num('seed', 'seed', 1, 4294967295);
  num('cov', 'coverage', 0.1, 0.9);
  num('worms', 'worms', 1, 4);
  num('strata', 'strata', 1, 8);
  num('cols', 'cols', 2, 24);
  num('rows', 'rows', 2, 18);
  num('area', 'areaM2', 0.5, 60);
  S.seed = Math.round(S.seed);
  S.worms = Math.round(S.worms);
  S.strata = Math.round(S.strata);
  S.cols = Math.round(S.cols);
  S.rows = Math.round(S.rows);

  const frame = Math.max(0, parseInt(query.get('frame') || '0', 10));
  const total = Math.max(1, parseInt(query.get('total') || '1', 10));
  S.progress = total > 1 ? frame / (total - 1) : 1;

  document.body.classList.add('render');
  scene = buildScene();
  const wq = parseInt(query.get('w') || '0', 10);
  const hq = parseInt(query.get('h') || '0', 10);
  const pxW = wq > 0 ? wq : Math.round(scene.W / S.pitchMM);
  const pxH = hq > 0 ? hq : Math.round(scene.H / S.pitchMM);
  cv.width = pxW; cv.height = pxH;
  cv.style.width = pxW + 'px'; cv.style.height = pxH + 'px';
  render();

  /* 供无头 Chrome --dump-dom 导出契约（无需点下载按钮） */
  const dump = query.get('dump');
  if (dump) {
    const payload = dump === 'scene' ? scenePayload() : curvesPayload();
    const pre = document.createElement('pre');
    pre.id = 'dump';
    pre.textContent = JSON.stringify(payload);
    document.body.innerHTML = '';
    document.body.appendChild(pre);
  }

  window.__renderReady = true;
}

/* ================= 启动 ================= */
function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get('native')) { nativeMode(q); return; }

  document.getElementById('area').addEventListener('input', e => {
    S.areaM2 = parseFloat(e.target.value) || 7.4; schedule();
  });
  document.getElementById('pitch').addEventListener('input', e => {
    S.pitchMM = parseFloat(e.target.value) || 1.5; schedule();
  });
  document.getElementById('aspectSel').addEventListener('change', applyAspect);
  ['aspectW', 'aspectH'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (Number.isFinite(v) && v > 0) S[id === 'aspectW' ? 'aspectW' : 'aspectH'] = v;
      schedule();
    });
  });
  document.getElementById('cols').addEventListener('input', e => {
    S.cols = clamp(parseInt(e.target.value, 10) || 10, 2, 24); schedule();
  });
  document.getElementById('rows').addEventListener('input', e => {
    S.rows = clamp(parseInt(e.target.value, 10) || 6, 2, 18); schedule();
  });
  document.getElementById('seed').addEventListener('input', e => {
    S.seed = parseInt(e.target.value, 10) || 1; schedule();
  });
  document.getElementById('reseed').addEventListener('click', () => {
    S.seed = Math.floor(Math.random() * 1e9);
    document.getElementById('seed').value = String(S.seed);
    schedule();
  });

  ranged('margin', 'marginPct', v => v.toFixed(1) + '%');
  ranged('strata', 'strata', v => String(v), true);
  ranged('coverage', 'coverage', v => v.toFixed(2));
  ranged('worms', 'worms', v => String(v), true);
  ranged('wallAff', 'wallAff', v => v.toFixed(2));
  ranged('dur', 'duration', v => v + 's', true);

  const loopEl = document.getElementById('loopAmp');
  const loopOut = document.getElementById('loopAmpVal');
  loopEl.addEventListener('input', () => {
    S.loopAmp = parseFloat(loopEl.value);
    S.profile = { ...S.profile, curveAmp: S.loopAmp };
    loopOut.textContent = S.loopAmp.toFixed(2);
    schedule();
  });

  document.getElementById('prog').addEventListener('input', e => {
    S.progress = parseFloat(e.target.value);
    document.getElementById('progVal').textContent = S.progress.toFixed(2);
    render();
  });
  document.getElementById('play').addEventListener('click', () => setPlaying(!S.playing));
  document.getElementById('regen').addEventListener('click', () => regenerate());
  document.getElementById('fileProfile').addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) loadProfileFile(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('expSvg').addEventListener('click', exportSVG);
  document.getElementById('expCurves').addEventListener('click', exportCurves);
  document.getElementById('expScene').addEventListener('click', exportScene);
  document.getElementById('expPng').addEventListener('click', exportPng);
  document.getElementById('copyCmd').addEventListener('click', copyCmd);

  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(resizedPreview, 160);
  });

  regenerate();
}

boot();
</script>
</body>
</html>
